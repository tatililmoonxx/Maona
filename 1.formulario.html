<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        :root{
            --very-ligth-pink: #c7c7c7;
            --text-imput-field: #f7f7f7;
            --hostpital-green: #acd982;
            --white: #ffffff;
            --black: #000000;
            --sm:14px;
            --md:16px;
            --lg:18px;
        }
        body{
            font-family: "Quicksand", sans-serif;
        
            margin: 0;
        }
        .login{
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .form-container{
            display: grid;
            grid-template-rows: auto ifr auto;
            width: 350px;

        }
        .logo{
            width: 150px;
            margin-bottom: 48px;
            justify-self: center;
            display: none;

        }
        .title{
            font-size:var(--lg) ;
            margin-bottom: 12px;
            text-align: center; 
        }
        .subtitle{
            color: var(--very-ligth-pink);
            font-size: var(--md);
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 32px;
            text-align: center;
        }
        .label{
            font-size: var(--sm);
            font-weight: bold;
            margin-bottom: 4px;
        }
        .input{
            background-color: var(--text-imput-field);
            border: none;
            border-radius: 8px;
            height: 30px;
            font-size: var(--md);
            padding: 6px;
            margin-bottom: 12px;
        }
        .form{
            display: flex;
            flex-direction: column;
        }
        .primary-button{
            background-color: var(--hostpital-green);
            border: none;
            border-radius: 8px;
            color:var(--white);
            width: 100%;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }
        .login-button{
            margin-top: 14px;
            margin-bottom: 30px;
        }
        @media (max-width: 640px){
            .logo{
                display: block;
            }
        }

    </style>
</head>
<body>
   <div class="login">
    <div class="form-container">
        <img src="./Logo.jpeg" alt="ImagenNegocio" class="logo">
        <h1 class="title">Create a new password</h1>
        <p class="subtitle">Enter a new password for you account</p>
        
        <form action="/" class="form">
            <label for="password" class="label">Password</label>
            <input type="password" class="input" id="password" class="input" placeholder="*************">

            <label for="new-password" class="label">Re-enter Password</label>
            <input type="password" class="input" id="new-password" class="input" placeholder="*************">

            <input type="submit" value="Comfirm" class="primary-button login-button">

        </form>
    </div>

   </div> 
</body>
</html>
